name: OSReview Windows Build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.7.*'
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Regression tests
        run: python -m pytest -q
      - name: Build hardware sensor engine
        shell: pwsh
        run: |
          dotnet publish sensor_bridge/SensorBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o sensor_bridge/publish
          Copy-Item sensor_bridge/publish/SensorBridge.exe sensor_bridge/SensorBridge.exe
          python -c "import pathlib,hashlib; p=pathlib.Path('sensor_bridge/SensorBridge.exe');p.with_suffix('.exe.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n',encoding='ascii')"
      - name: Fetch official PresentMon console engine with SHA256 verification
        run: python fps_engine/preparar_motor_fps.py
      - name: Package OSReview Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name OSReview --icon assets/osreview.ico --version-file build/version_info.txt --add-data "assets/osreview.png;assets" --add-data "licenses/NOTICE-LIBREHARDWAREMONITOR.txt;licenses" --add-data "licenses/MPL-2.0.txt;licenses" --add-data "fps_engine/AVISO_DE_TERCEIROS.md;fps_engine" --add-binary "sensor_bridge/SensorBridge.exe;sensor_bridge" --add-data "sensor_bridge/SensorBridge.exe.sha256;sensor_bridge" --add-binary "fps_engine/PresentMon.exe;fps_engine" --hidden-import pystray._win32 run.py
      - name: Save unsigned artifact for validation (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: OSReview-v0.7.5-Windows-unsigned
          path: dist/OSReview/
