name: OSReview 0.9.1 RC4 - Instaladores Windows e macOS
on:
  workflow_dispatch:
  push:
    tags: ["v0.9.1-rc.4"]
permissions:
  contents: read
jobs:
  windows-x64:
    name: Windows x64 - GUI Inno Setup
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup build tool (somente CI)
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Compilar executavel independente e instalador final
        shell: cmd
        run: call build\Gerar_Instalador_Windows_x64.bat
      - name: Smoke test do executável empacotado
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/OSReview/OSReview.exe') -ArgumentList '--diagnostico' -PassThru -Wait -WindowStyle Hidden -WorkingDirectory (Get-Location).Path
          if ($process.ExitCode -ne 0) { throw "OSReview.exe --diagnostico falhou: $($process.ExitCode)" }
          if (-not (Test-Path 'OSReview_suporte_inicializacao.zip')) { throw 'Relatório de diagnóstico não gerado' }
      - name: Inspecionar instalador e SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/OSReview-Setup-0.9.1-rc.4-Windows-x64-*.exe)
          if ($files.Count -ne 1) { throw "Instalador nao encontrado ou duplicado" }
          Get-FileHash $files[0].FullName -Algorithm SHA256
          if (-not (Test-Path 'release/OSReview-Portable-0.9.1-rc.4-Windows-x64.zip')) { throw 'ZIP portatil ausente' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OSReview-0.9.1-rc.4-Windows-x64-NAO-ASSINADO
          path: |
            release/OSReview-Setup-0.9.1-rc.4-Windows-x64-*.exe
            release/OSReview-Setup-0.9.1-rc.4-Windows-x64-*.sha256
            release/OSReview-Portable-0.9.1-rc.4-Windows-x64.zip
            release/OSReview-Portable-0.9.1-rc.4-Windows-x64.zip.sha256
          if-no-files-found: error
  macos-intel:
    name: macOS Intel - instalador nativo GUI
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirmar arquitetura
        run: test "$(uname -m)" = "x86_64"
      - name: Compilar AppKit e DMG
        run: bash build/Gerar_Instalador_macOS.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OSReview-0.9.1-rc.4-macOS-Intel-NAO-NOTARIZADO
          path: |
            release/OSReview-0.9.1-rc.4-macOS-x86_64-*.dmg
            release/OSReview-0.9.1-rc.4-macOS-x86_64-*.sha256
          if-no-files-found: error
  macos-apple-silicon:
    name: macOS Apple Silicon - instalador nativo GUI
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirmar arquitetura
        run: test "$(uname -m)" = "arm64"
      - name: Compilar AppKit e DMG
        run: bash build/Gerar_Instalador_macOS.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OSReview-0.9.1-rc.4-macOS-AppleSilicon-NAO-NOTARIZADO
          path: |
            release/OSReview-0.9.1-rc.4-macOS-arm64-*.dmg
            release/OSReview-0.9.1-rc.4-macOS-arm64-*.sha256
          if-no-files-found: error
  publicar-release:
    name: Publicar Release Windows e macOS
    needs: [windows-x64, macos-intel, macos-apple-silicon]
    if: github.ref == 'refs/tags/v0.9.1-rc.4'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: OSReview-0.9.1-rc.4-*
          path: release
          merge-multiple: true
      - name: Publicar instalador na Release do GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(
            'release/OSReview-Setup-0.9.1-rc.4-Windows-x64-NAO-ASSINADO.exe',
            'release/OSReview-Setup-0.9.1-rc.4-Windows-x64-NAO-ASSINADO.exe.sha256',
            'release/OSReview-Portable-0.9.1-rc.4-Windows-x64.zip',
            'release/OSReview-Portable-0.9.1-rc.4-Windows-x64.zip.sha256',
            'release/OSReview-0.9.1-rc.4-macOS-x86_64-NAO-NOTARIZADO.dmg',
            'release/OSReview-0.9.1-rc.4-macOS-x86_64-NAO-NOTARIZADO.dmg.sha256',
            'release/OSReview-0.9.1-rc.4-macOS-arm64-NAO-NOTARIZADO.dmg',
            'release/OSReview-0.9.1-rc.4-macOS-arm64-NAO-NOTARIZADO.dmg.sha256'
          )
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Faltando $file" } }
          gh release view $tag -R $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files -R $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao anexar arquivos à Release existente' }
            gh release edit $tag -R $env:GITHUB_REPOSITORY --draft=false --prerelease
          } else {
            gh release create $tag $files -R $env:GITHUB_REPOSITORY --verify-tag --prerelease --latest=false --title 'OSReview 0.9.1 RC4' --notes-file RELEASE_NOTES_0.9.1_RC4.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar Release' }
